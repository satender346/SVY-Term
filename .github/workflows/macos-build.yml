name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew update
          brew install qt libssh libvterm

      - name: Configure
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          export PKG_CONFIG_PATH="$(brew --prefix libssh)/lib/pkgconfig:$(brew --prefix libvterm)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DSVYTERM_ENABLE_LIBSSH=ON

      - name: Build
        run: cmake --build build -j

      - name: Generate and embed app icon
        run: bash resources/build_icon.sh build/SVY-Term.app

      - name: Bundle with macdeployqt
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/SVY-Term.app -verbose=1

      - name: Fix all unbundled Homebrew references
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          FW="$APP/Contents/Frameworks"
          MACOS="$APP/Contents/MacOS"
          mkdir -p "$FW"

          # Return all Mach-O files in the bundle
          list_macho() {
            find "$APP" -type f -print0 | xargs -0 file 2>/dev/null \
              | grep 'Mach-O' | cut -d: -f1
          }

          # Copy a Homebrew dylib into Frameworks (once) and fix its LC_ID_DYLIB
          ensure_bundled() {
            local src="$1"
            local base
            base="$(basename "$src")"
            if [ ! -f "$FW/$base" ]; then
              cp -L "$src" "$FW/$base"
              chmod u+w "$FW/$base"
            fi
            # Always fix the id so it resolves via @rpath
            install_name_tool -id "@rpath/$base" "$FW/$base"
          }

          # Pass 1-8: copy missing deps and rewrite -change references
          for pass in $(seq 1 8); do
            changed=0
            while IFS= read -r target; do
              [ -f "$target" ] || continue
              chmod u+w "$target"

              # Get the LC_ID_DYLIB of this file (first entry in otool -L output)
              own_id="$(otool -L "$target" 2>/dev/null | sed -n '2p' | awk '{print $1}')"

              # Fix LC_ID_DYLIB if it still points to Homebrew
              case "$own_id" in
                /opt/homebrew/*|/usr/local/*)
                  base="$(basename "$own_id")"
                  install_name_tool -id "@rpath/$base" "$target"
                  changed=1
                  ;;
              esac

              # Fix all dependency references (LC_LOAD_DYLIB), skipping line 1 (binary path)
              # and line 2 (own id, already handled above)
              while IFS= read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*)
                    base="$(basename "$dep")"
                    ensure_bundled "$dep"
                    install_name_tool -change "$dep" "@rpath/$base" "$target"
                    changed=1
                    ;;
                esac
              done < <(otool -L "$target" 2>/dev/null | tail -n +3 | awk '{print $1}')
            done < <(list_macho)
            echo "Pass $pass: changed=$changed"
            [ "$changed" -eq 0 ] && break
          done

          # Ensure the main binary can find @rpath libs
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
            "$MACOS/SVY-Term" 2>/dev/null || true

          # Ensure every Mach-O inside the bundle can find sibling libs via @rpath
          while IFS= read -r target; do
            [ -f "$target" ] || continue
            install_name_tool -add_rpath "@loader_path" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../.." "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$target" 2>/dev/null || true
          done < <(list_macho)

      - name: Verify bundle is self-contained
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          echo "Builder macOS: $(sw_vers -productVersion)"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/SVY-Term")"
          echo "Minimum macOS required by binary:"
          otool -l "$APP/Contents/MacOS/SVY-Term" | grep -A3 LC_BUILD_VERSION | grep minos || true
          LEAKED=0
          while IFS= read -r binary; do
            file -b "$binary" | grep -q 'Mach-O' || continue
            # Check ALL lines of otool -L (including LC_ID_DYLIB on line 2)
            if otool -L "$binary" 2>/dev/null | tail -n +2 | grep -Eq '/opt/homebrew/|/usr/local/'; then
              echo "ERROR: unbundled dependency in $binary"
              otool -L "$binary" | grep -E '/opt/homebrew/|/usr/local/'
              LEAKED=1
            fi
          done < <(find "$APP" -type f)
          if [ "$LEAKED" -ne 0 ]; then
            echo "Bundle would fail to launch on a clean Mac."
            exit 1
          fi
          echo "All dependencies are bundled."

      - name: Re-sign app bundle (ad-hoc, inside-out)
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          # Sign every Mach-O leaf (dylibs + plugins) before signing frameworks and the app
          find "$APP" -type f -print0 | xargs -0 file 2>/dev/null \
            | grep 'Mach-O' | cut -d: -f1 \
            | grep -v 'Contents/MacOS/SVY-Term' \
            | while IFS= read -r f; do
                codesign --force --timestamp=none --sign - "$f"
              done
          # Sign frameworks as bundles
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' \
            -exec codesign --force --timestamp=none --sign - {} \;
          # Finally sign the app bundle itself
          codesign --force --timestamp=none --sign - "$APP"

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 build/SVY-Term.app

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
