name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt on runner
        run: |
          brew update
          brew install qt

      - name: Configure
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DSVYTERM_ENABLE_LIBSSH=OFF

      - name: Build
        run: cmake --build build -j

      - name: Bundle Qt frameworks
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/SVY-Term.app -verbose=2

      - name: Re-sign app bundle (ad-hoc)
        run: |
          codesign --force --deep --sign - build/SVY-Term.app

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/SVY-Term.app

      - name: Package app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
