name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt on runner
        run: |
          brew update
          brew install qt libssh libvterm

      - name: Configure
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          export PKG_CONFIG_PATH="$(brew --prefix libssh)/lib/pkgconfig:$(brew --prefix libvterm)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DSVYTERM_ENABLE_LIBSSH=ON

      - name: Build
        run: cmake --build build -j

      - name: Bundle Qt frameworks
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/SVY-Term.app -verbose=2

      - name: Bundle non-Qt dylibs (libvterm, libssh, transitive deps)
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"

          # macdeployqt only relocates Qt itself. Homebrew deps (libvterm, libssh,
          # and Qt's own pcre2/zstd/glib) stay as /opt/homebrew paths that do not
          # exist on user machines, so every Mach-O in the bundle is rewritten to
          # a @loader_path reference into Contents/Frameworks.
          list_macho() {
            find "$APP" -type f | while read -r f; do
              if file -b "$f" | grep -q 'Mach-O'; then echo "$f"; fi
            done
          }

          rel_to_frameworks() {
            python3 -c "import os,sys; print(os.path.relpath(sys.argv[1], os.path.dirname(sys.argv[2])))" "$FRAMEWORKS" "$1"
          }

          for pass in 1 2 3 4 5; do
            changed=0
            while IFS= read -r target; do
              chmod u+w "$target"
              rel="$(rel_to_frameworks "$target")"
              while IFS= read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*)
                    base="$(basename "$dep")"
                    if [ ! -f "$FRAMEWORKS/$base" ]; then
                      cp -L "$dep" "$FRAMEWORKS/$base"
                      chmod u+w "$FRAMEWORKS/$base"
                      install_name_tool -id "@loader_path/$base" "$FRAMEWORKS/$base"
                    fi
                    install_name_tool -change "$dep" "@loader_path/$rel/$base" "$target"
                    changed=1
                    ;;
                esac
              done < <(otool -L "$target" | tail -n +2 | awk '{print $1}')
            done < <(list_macho)
            echo "pass $pass: changed=$changed"
            [ "$changed" -eq 0 ] && break
          done

      - name: Verify no external library paths remain
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          echo "Builder macOS: $(sw_vers -productVersion)"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/SVY-Term")"
          echo "Minimum macOS required by binary:"
          otool -l "$APP/Contents/MacOS/SVY-Term" | grep -A3 LC_BUILD_VERSION | grep minos || true
          LEAKED=0
          while IFS= read -r binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              if otool -L "$binary" | tail -n +2 | grep -Eq '/opt/homebrew/|/usr/local/'; then
                echo "ERROR: unbundled dependency in $binary"
                otool -L "$binary" | grep -E '/opt/homebrew/|/usr/local/'
                LEAKED=1
              fi
            fi
          done < <(find "$APP" -type f)
          if [ "$LEAKED" -ne 0 ]; then
            echo "Bundle would fail to launch on a clean Mac."
            exit 1
          fi
          echo "All dependencies are bundled."

      - name: Re-sign app bundle (ad-hoc, inside-out)
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          find "$APP/Contents/Frameworks" -name '*.dylib' -exec codesign --force --timestamp=none --sign - {} \;
          find "$APP/Contents/Frameworks" -name '*.framework' -maxdepth 1 -exec codesign --force --timestamp=none --sign - {} \;
          codesign --force --timestamp=none --sign - "$APP"

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/SVY-Term.app

      - name: Package app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
