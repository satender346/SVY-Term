name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (no Homebrew)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ runner.arch == 'ARM64' && 'clang_arm64' || 'clang_64' }}
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.QT_ROOT_DIR }}" \
            -DSVYTERM_ENABLE_LIBSSH=OFF

      - name: Build
        run: cmake --build build -j

      - name: Bundle Qt frameworks
        run: |
          "${{ steps.qt.outputs.QT_ROOT_DIR }}/bin/macdeployqt" build/SVY-Term.app -verbose=2

      - name: Package app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
