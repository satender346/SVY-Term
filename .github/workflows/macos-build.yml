name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew update
          brew install qt libssh libvterm

      - name: Configure
        run: |
          QT_PREFIX="$(brew --prefix qt)"
          export PKG_CONFIG_PATH="$(brew --prefix libssh)/lib/pkgconfig:$(brew --prefix libvterm)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DSVYTERM_ENABLE_LIBSSH=ON

      - name: Build
        run: cmake --build build -j

      - name: Bundle with macdeployqt
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/SVY-Term.app -verbose=1

      - name: Bundle Homebrew dylibs
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          MACOS="$APP/Contents/MacOS"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"

          # Collect every Mach-O in the bundle
          list_macho() {
            find "$APP" -type f -print0 | xargs -0 file | grep 'Mach-O' | cut -d: -f1
          }

          # Copy a Homebrew dylib into Frameworks and fix its own id
          copy_dep() {
            local src="$1"
            local base
            base="$(basename "$src")"
            if [ ! -f "$FW/$base" ]; then
              cp -L "$src" "$FW/$base"
              chmod u+w "$FW/$base"
              install_name_tool -id "@rpath/$base" "$FW/$base"
            fi
          }

          # Rewrite all /opt/homebrew and /usr/local references in every Mach-O
          # Run multiple passes until nothing changes (transitive deps)
          for pass in $(seq 1 8); do
            changed=0
            while IFS= read -r target; do
              [ -f "$target" ] || continue
              chmod u+w "$target"
              while IFS= read -r dep; do
                case "$dep" in
                  /opt/homebrew/*|/usr/local/*)
                    base="$(basename "$dep")"
                    copy_dep "$dep"
                    install_name_tool -change "$dep" "@rpath/$base" "$target"
                    changed=1
                    ;;
                esac
              done < <(otool -L "$target" 2>/dev/null | tail -n +2 | awk '{print $1}')
            done < <(list_macho)
            echo "Pass $pass: changed=$changed"
            [ "$changed" -eq 0 ] && break
          done

          # Ensure the main binary has an @rpath entry pointing at ../Frameworks
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$MACOS/SVY-Term" 2>/dev/null || true

          # Ensure every framework dylib also has @rpath pointing at its own Frameworks dir
          while IFS= read -r target; do
            [ -f "$target" ] || continue
            install_name_tool -add_rpath "@loader_path/../Frameworks" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path/../../.." "$target" 2>/dev/null || true
          done < <(list_macho)

      - name: Verify bundle is self-contained
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          echo "Builder macOS: $(sw_vers -productVersion)"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/SVY-Term")"
          echo "Minimum macOS required by binary:"
          otool -l "$APP/Contents/MacOS/SVY-Term" | grep -A3 LC_BUILD_VERSION | grep minos || true
          LEAKED=0
          while IFS= read -r binary; do
            file -b "$binary" | grep -q 'Mach-O' || continue
            if otool -L "$binary" 2>/dev/null | tail -n +2 | grep -Eq '/opt/homebrew/|/usr/local/'; then
              echo "ERROR: unbundled dependency in $binary"
              otool -L "$binary" | grep -E '/opt/homebrew/|/usr/local/'
              LEAKED=1
            fi
          done < <(find "$APP" -type f)
          if [ "$LEAKED" -ne 0 ]; then
            echo "Bundle would fail to launch on a clean Mac."
            exit 1
          fi
          echo "All dependencies are bundled."

      - name: Re-sign app bundle (ad-hoc, inside-out)
        run: |
          set -euo pipefail
          APP="build/SVY-Term.app"
          # Sign dylibs first, then frameworks, then the app itself
          find "$APP/Contents/Frameworks" -name '*.dylib' \
            -exec codesign --force --timestamp=none --sign - {} \;
          find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' \
            -exec codesign --force --timestamp=none --sign - {} \;
          codesign --force --timestamp=none --sign - "$APP"

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 build/SVY-Term.app

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
