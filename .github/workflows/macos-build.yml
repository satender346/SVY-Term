name: macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      QT_VERSION: 6.8.3
      QT_ROOT: /Users/runner/qt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt via aqt (no Homebrew)
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.1.18
          python -m aqt install-qt mac desktop "$QT_VERSION" macos -O "$QT_ROOT"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT/$QT_VERSION/macos" \
            -DSVYTERM_ENABLE_LIBSSH=OFF

      - name: Build
        run: cmake --build build -j

      - name: Bundle Qt frameworks
        run: |
          "$QT_ROOT/$QT_VERSION/macos/bin/macdeployqt" build/SVY-Term.app -verbose=2

      - name: Package app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent SVY-Term.app SVY-Term-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVY-Term-macOS
          path: build/SVY-Term-macOS.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/SVY-Term-macOS.zip
